name: Syntax and tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: for script in bootstrap.sh install.sh audit.sh deploy.sh integrate-existing.sh backup.sh restore.sh; do bash -n "$script" || exit 1; done
      - run: npm run check
      - run: npm test
      - run: sudo bash test/backup-smoke.sh
      - run: sudo bash test/tls-smoke.sh
